<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Illustrative cluttered FICTA-1 results slide</title><desc id="desc">Synthetic trial data: ACR20 response at week 24 was 58 percent versus 31 percent, a 27 percentage point difference with a 95 percent confidence interval from 15 to 39 points.</desc>
  <rect width="960" height="540" fill="#eeeeee"/>
  <rect x="0" y="0" width="960" height="75" fill="#474d81"/>
  <text x="36" y="48" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="white">Clinical trial results</text>
  <rect x="33" y="96" width="415" height="345" rx="7" fill="white" stroke="#c8cbd4"/>
  <rect x="465" y="96" width="460" height="345" rx="7" fill="white" stroke="#c8cbd4"/>
  <text x="53" y="132" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#343850">ACR20 response</text>
  <line x1="95" y1="361" x2="421" y2="361" stroke="#c9c9cf" stroke-width="2"/>
  <line x1="95" y1="176" x2="95" y2="361" stroke="#c9c9cf" stroke-width="2"/>
  <line x1="95" y1="269" x2="421" y2="269" stroke="#e5e5e9" stroke-width="2"/>
  <rect x="163" y="197" width="68" height="164" fill="#847ab5"/><rect x="288" y="273" width="68" height="88" fill="#aeb3c5"/>
  <text x="170" y="187" font-family="Arial,sans-serif" font-size="20" fill="#343850">58%</text><text x="294" y="263" font-family="Arial,sans-serif" font-size="20" fill="#343850">31%</text>
  <text x="155" y="392" font-family="Arial,sans-serif" font-size="16" fill="#343850">Examplimab</text><text x="292" y="392" font-family="Arial,sans-serif" font-size="16" fill="#343850">Placebo</text>
  <text x="485" y="132" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#343850">Key findings</text>
  <text x="488" y="177" font-family="Arial,sans-serif" font-size="19" fill="#343850">• ACR20: 58% vs 31%</text>
  <text x="488" y="216" font-family="Arial,sans-serif" font-size="19" fill="#343850">• Difference: 27 percentage points</text>
  <text x="488" y="255" font-family="Arial,sans-serif" font-size="19" fill="#343850">• 95% CI: 15–39 percentage points</text>
  <text x="488" y="294" font-family="Arial,sans-serif" font-size="19" fill="#343850">• p &lt; 0.001</text>
  <text x="488" y="333" font-family="Arial,sans-serif" font-size="19" fill="#343850">• n = 120 in each arm</text>
  <rect x="487" y="374" width="400" height="42" rx="5" fill="#e9e8f4"/><text x="502" y="402" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#474d81">Statistically significant result!</text>
  <text x="35" y="487" font-family="Arial,sans-serif" font-size="15" fill="#626775">FICTA-1 trial results · week 24 · biologic-naive active PsA</text>
  <text x="35" y="516" font-family="Arial,sans-serif" font-size="12" fill="#777b86">Doe et al., J Synth Ex 2025 (synthetic)</text>
</svg>
